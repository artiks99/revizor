services:
  caddy:
    image: caddy:2-alpine
    container_name: revizor-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./caddy_data:/data
      - ./caddy_config:/config
    depends_on:
      - server

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: revizor-server
    restart: always
    environment:
      - PORT=4820
      - DB_PATH=/opt/revizor/data/revision.db
    volumes:
      - ./data:/opt/revizor/data
      - ./backups:/opt/revizor/backups
    ports:
      - "127.0.0.1:4820:4820"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:4820/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
